name: Release plugin

on:
  push:
    branches: [main]      # 自动：main 上 plugin.json 改了版本号（且该版本还没发布过）就发布
    paths: ['plugin.json']
    tags: ['v*']          # 自动：推送 v0.3.2 这类标签也会发布
  workflow_dispatch:      # 手动：Actions 页面点 Run workflow
    inputs:
      publish:
        description: '创建/更新 GitHub Release（取消勾选则只产出构建附件）'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  # 判断本次是否需要发布：main 分支推送时，只有「该版本号还没有对应标签」才发布
  check:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.c.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: c
        run: |
          ver=$(node -p "require('./plugin.json').version")
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_type }}" = "branch" ]; then
            if git ls-remote --exit-code --tags origin "refs/tags/v$ver" >/dev/null 2>&1; then
              echo "v$ver 已发布过，跳过"; echo "release=false" >> "$GITHUB_OUTPUT"
            else
              echo "release=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read plugin info
        id: info
        run: |
          echo "version=$(node -p "require('./plugin.json').version")" >> "$GITHUB_OUTPUT"
          echo "entry=$(node -p "require('./plugin.json').entryPath")" >> "$GITHUB_OUTPUT"

      - name: Check tag matches plugin.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [ "${GITHUB_REF_NAME}" != "v${{ steps.info.outputs.version }}" ]; then
            echo "::error::标签 ${GITHUB_REF_NAME} 与 plugin.json 版本 v${{ steps.info.outputs.version }} 不一致"
            exit 1
          fi

      # 整理 plugin.json（按官方「插件源」文档）：
      # updateUrl 指向仓库里的 manifest.json（version + download_url），plugin.json 里不再写死 download_url
      - name: Normalize plugin.json
        run: |
          node -e "
            const fs=require('fs');
            const repo=process.env.GITHUB_REPOSITORY;
            const p=JSON.parse(fs.readFileSync('plugin.json','utf8'));
            p.homepage='https://github.com/'+repo;
            p.updateUrl='https://raw.githubusercontent.com/'+repo+'/main/manifest.json';
            delete p.download_url;
            fs.writeFileSync('plugin.json',JSON.stringify(p,null,2)+'\n');
          "

      - name: Install dependencies
        run: |
          corepack enable
          if   [ -f pnpm-lock.yaml ];    then pnpm install --frozen-lockfile || pnpm install
          elif [ -f yarn.lock ];         then yarn install --frozen-lockfile || yarn install
          elif [ -f package-lock.json ]; then npm ci || npm install
          else npm install; fi

      # PWA 图标：由 static/icon.svg 生成 192/512/maskable PNG 到 static/icons/（脚本内嵌，不依赖仓库里的其他文件）
      - name: Generate PWA icons
        run: |
          test -f static/icon.svg || { echo "::error::找不到 static/icon.svg"; exit 1; }
          mkdir -p /tmp/icongen && cd /tmp/icongen && npm init -y >/dev/null && npm i sharp
          cd "$GITHUB_WORKSPACE"
          cat > /tmp/gen-icons.cjs <<'JS'
          const sharp = require('/tmp/icongen/node_modules/sharp');
          const fs = require('fs');
          (async () => {
            const src = 'static/icon.svg';
            fs.mkdirSync('static/icons', { recursive: true });
            const bg = { r: 0, g: 0, b: 0, alpha: 0 };
            for (const s of [192, 512]) {
              await sharp(src, { density: 384 }).resize(s, s, { fit: 'contain', background: bg }).png().toFile('static/icons/icon-' + s + '.png');
            }
            const inner = await sharp(src, { density: 384 }).resize(410, 410, { fit: 'contain', background: bg }).png().toBuffer();
            await sharp({ create: { width: 512, height: 512, channels: 4, background: '#415F91' } })
              .composite([{ input: inner, gravity: 'center' }]).png().toFile('static/icons/icon-maskable-512.png');
            console.log('icons generated');
          })().catch(e => { console.error(e); process.exit(1); });
          JS
          node /tmp/gen-icons.cjs
          ls -l static/icons

      # 把页面右下角的版本号占位符替换成 plugin.json 的 version（只改构建副本，不提交）
      - name: Inject version into page
        run: |
          sed -i "s/__PLUGIN_VERSION__/${{ steps.info.outputs.version }}/g" static/index.html
          grep -n "var v = " static/index.html

      - name: Build
        run: |
          if   [ -f pnpm-lock.yaml ]; then pnpm run build
          elif [ -f yarn.lock ];      then yarn build
          else npm run build; fi

      - name: Verify package
        run: |
          ls -l dist
          unzip -l dist/*.jsplugin.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.info.outputs.entry }}-${{ steps.info.outputs.version }}
          path: dist/*

      - name: Publish GitHub Release
        if: github.event_name == 'push' || inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.info.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ steps.info.outputs.version }}
          generate_release_notes: true
          files: |
            dist/*.jsplugin.zip
            dist/*.json

      # 发布成功后，把更新清单 manifest.json（version + download_url）和整理后的 plugin.json 提交回 main，
      # 供 Songloft 在线检查更新 / 被插件源订阅。清单只在 Release 已存在之后才变化，
      # 所以不会出现「提示有新版本但下载不到」。
      - name: Update manifest.json on main
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.publish)
        run: |
          node -e "
            const fs=require('fs');
            const repo=process.env.GITHUB_REPOSITORY;
            const p=JSON.parse(fs.readFileSync('plugin.json','utf8'));
            const m={version:p.version,download_url:'https://github.com/'+repo+'/releases/download/v'+p.version+'/'+p.entryPath+'.jsplugin.zip'};
            fs.writeFileSync('/tmp/manifest.json',JSON.stringify(m,null,2)+'\n');
          "
          cp plugin.json /tmp/plugin.json
          git checkout -- plugin.json static/index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          cp /tmp/plugin.json plugin.json
          cp /tmp/manifest.json manifest.json
          git add plugin.json manifest.json
          if git diff --cached --quiet; then
            echo "无变化"
          else
            git commit -m "chore: manifest -> v${{ steps.info.outputs.version }} [skip ci]"
            git push origin HEAD:main
          fi

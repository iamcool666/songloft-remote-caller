name: Release plugin

on:
  push:
    tags: ['v*']          # 自动：推送 v0.3.2 这类标签即打包发布
  workflow_dispatch:      # 手动：Actions 页面点 Run workflow
    inputs:
      publish:
        description: '创建/更新 GitHub Release（取消勾选则只产出构建附件）'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read plugin info
        id: info
        run: |
          echo "version=$(node -p "require('./plugin.json').version")" >> "$GITHUB_OUTPUT"
          echo "entry=$(node -p "require('./plugin.json').entryPath")" >> "$GITHUB_OUTPUT"

      - name: Check tag matches plugin.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [ "${GITHUB_REF_NAME}" != "v${{ steps.info.outputs.version }}" ]; then
            echo "::error::标签 ${GITHUB_REF_NAME} 与 plugin.json 版本 v${{ steps.info.outputs.version }} 不一致"
            exit 1
          fi

      # 仅作用于本次构建（不提交）：让包内的更新地址指向当前仓库而不是上游
      - name: Point plugin.json URLs to this repo
        run: |
          node -e "
            const fs=require('fs');
            const repo=process.env.GITHUB_REPOSITORY;
            const p=JSON.parse(fs.readFileSync('plugin.json','utf8'));
            p.homepage='https://github.com/'+repo;
            p.updateUrl='https://raw.githubusercontent.com/'+repo+'/main/plugin.json';
            p.download_url='https://github.com/'+repo+'/releases/download/v'+p.version+'/'+p.entryPath+'.jsplugin.zip';
            fs.writeFileSync('plugin.json',JSON.stringify(p,null,2)+'\n');
          "

      - name: Install dependencies
        run: |
          corepack enable
          if   [ -f pnpm-lock.yaml ];    then pnpm install --frozen-lockfile || pnpm install
          elif [ -f yarn.lock ];         then yarn install --frozen-lockfile || yarn install
          elif [ -f package-lock.json ]; then npm ci || npm install
          else npm install; fi

      # PWA 图标：由 static/icon.svg 生成 192/512/maskable PNG 到 static/icons/
      - name: Generate PWA icons
        run: |
          mkdir -p /tmp/icongen && cd /tmp/icongen && npm init -y >/dev/null && npm i sharp
          cd "$GITHUB_WORKSPACE" && SHARP_DIR=/tmp/icongen node scripts/gen-icons.mjs

      - name: Build
        run: |
          if   [ -f pnpm-lock.yaml ]; then pnpm run build
          elif [ -f yarn.lock ];      then yarn build
          else npm run build; fi

      - name: Verify package
        run: |
          ls -l dist
          unzip -l dist/*.jsplugin.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.info.outputs.entry }}-${{ steps.info.outputs.version }}
          path: dist/*

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.info.outputs.version }}
          name: v${{ steps.info.outputs.version }}
          generate_release_notes: true
          files: |
            dist/*.jsplugin.zip
            dist/*.json
